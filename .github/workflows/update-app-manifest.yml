name: Update App Manifest and Deploy Pages

on:
  push:
    branches:
      - page
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: page-publish
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout page
        uses: actions/checkout@v4
        with:
          ref: page
          fetch-depth: 0

      - name: Prepare page version
        run: |
          VERSION_NUMBER="$(TZ=Asia/Shanghai date +'%Y%m%d%H%M%S')"
          echo "APP_MANIFEST_VERSION_NAME=page-${VERSION_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_MANIFEST_VERSION_NUMBER=${VERSION_NUMBER}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate app manifest
        run: python scripts/generate_app_manifest.py

      - name: Commit manifest to page
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/packages/manifest.json
          if git diff --cached --quiet; then
            echo "No app manifest changes to commit."
          else
            git commit -m "【codex】更新 App manifest"
            git push origin HEAD:page
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
