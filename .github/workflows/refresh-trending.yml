name: Refresh GitHub Trending

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-trending
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update trending data
        run: python scripts/update_trending.py --since daily --limit 6

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "【codex】更新 GitHub Trending 数据"
          branch: automated/refresh-github-trending
          delete-branch: true
          title: "【codex】更新 GitHub Trending 数据"
          body: |
            自动刷新 GitHub Trending 数据。

            更新文件：
            - `data/trending.json`
            - `data/trending.js`
          add-paths: |
            data/trending.json
            data/trending.js
