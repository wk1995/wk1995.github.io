    <div class="catalog-topbar-actions">

        <span class="control-label" id="language-label" data-i18n="controls.language">语言</span>
        <select class="language-select" id="language-select" aria-label="语言">
          <option value="zh">简体中文</option>
          <option value="en">English</option>

      </label>
      <div class="control-group">
        <span class="control-label" id="theme-caption" data-i18n="controls.theme">主题</span>

        <div class="app-detail-copy">

          <p id="app-detail-summary">读取安装包清单中。</p>
          <div class="app-detail-chips" aria-label="版本摘要">
            <span class="app-detail-live"><i></i><span id="app-detail-release-state">持续发布</span></span>
            <span id="app-detail-version-chip">Latest</span>
            <span id="app-detail-updated-chip">—</span>

      <aside class="app-latest-release" aria-labelledby="app-latest-title">
        <div class="app-latest-copy">

        <div><dt id="app-fact-platform-label">平台</dt><dd id="app-fact-platform">—</dd></div>

        <div><dt id="app-fact-builds-label">可用版本</dt><dd id="app-fact-builds">0</dd></div>

    <section class="app-detail-layout">
      <article class="catalog-section app-release-section">
        <div class="catalog-section-head app-release-head">
          <div>
            <p class="catalog-kicker" id="app-version-kicker">Release activity</p>
            <h2 id="app-version-title">版本动态</h2>
          </div>
          <span class="app-release-count"><strong id="app-version-count">0</strong><span id="app-version-count-unit"> 个版本</span></span>
        </div>
        <div class="app-version-list" id="app-version-list"></div>

      <aside class="catalog-section app-about-section">

          </div>
        </div>
        <div class="app-readme" id="app-readme"></div>

    <div class="catalog-status" id="app-detail-status" role="status" aria-live="polite"></div>
