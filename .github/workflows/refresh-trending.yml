name: Refresh GitHub Trending

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PAGE_BRANCH: page

concurrency:
  group: refresh-trending-page
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update page branch from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$PAGE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PAGE_BRANCH"
            git switch --force-create "$PAGE_BRANCH" "origin/$PAGE_BRANCH"
            git merge origin/main -m "[home][mac-min] 同步 main 到 page"
          else
            git switch --force-create "$PAGE_BRANCH" origin/main
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update trending data
        run: python scripts/update_trending.py --since daily --limit 6

      - name: Commit and publish page branch
        run: |
          git add data/trending.json data/trending.js
          if git diff --cached --quiet; then
            echo "No trending changes to commit."
          else
            git commit -m "[home][mac-min] 【codex】更新 GitHub Trending 数据"
          fi
          git push origin "$PAGE_BRANCH"

      - name: Update manifest and deploy page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-app-manifest.yml --ref page
