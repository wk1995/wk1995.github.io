name: Update App Manifest

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "scripts/generate_app_manifest.py"
      - ".github/workflows/update-app-manifest.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: app-manifest-main
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare page version
        run: |
          VERSION_NUMBER="$(TZ=Asia/Shanghai date +'%Y%m%d%H%M%S')"
          echo "APP_MANIFEST_VERSION_NAME=main-${VERSION_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_MANIFEST_VERSION_NUMBER=${VERSION_NUMBER}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate app manifest
        run: python scripts/generate_app_manifest.py

      - name: Publish manifest through pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/packages/manifest.json
          if git diff --cached --quiet; then
            echo "No app manifest changes to commit."
            exit 0
          fi

          manifest_branch="automation/update-app-manifest-${GITHUB_RUN_ID}"
          git switch --create "$manifest_branch"
          git commit -m "[home][mac-min] 【codex】更新 App manifest"
          git push --set-upstream origin "$manifest_branch"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$manifest_branch" \
            --title "[home][mac-min] 【codex】更新 App manifest" \
            --body "Automatically refreshes the Apps catalog after package files changed.")"
          gh pr merge "$pr_url" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch

          # GITHUB_TOKEN-authored merges do not emit another workflow run.
          # Dispatch the page refresh explicitly so the merged manifest is deployed.
          gh workflow run refresh-trending.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
