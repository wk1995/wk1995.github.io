name: Publish Blog Article

on:
  push:
    branches:
      - main
    paths:
      - "content/blog/posts/**/*.md"
      - "articles/**/*.md"
  workflow_dispatch:
    inputs:
      article_path:
        description: "Markdown article path to publish"
        required: true
        type: string
      target:
        description: "Use posts for live blog publishing, drafts for review"
        required: true
        default: posts
        type: choice
        options:
          - posts
          - drafts
      target_branch:
        description: "wk1995.github.io branch handled by the receiver workflow"
        required: true
        default: page
        type: string
      overwrite:
        description: "Allow replacing an existing Markdown file in wk1995.github.io"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  publish-blog-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check target repository token
        env:
          TARGET_REPO_TOKEN: ${{ secrets.PUBLISH_BLOG_FROM_SOURCE_REPO_TO_GITHUB_IO }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "Missing secret PUBLISH_BLOG_FROM_SOURCE_REPO_TO_GITHUB_IO. It must be a fine-grained token that can trigger repository_dispatch on wk1995/wk1995.github.io." >&2
            exit 1
          fi

      - name: Resolve articles
        id: articles
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ARTICLE_PATH: ${{ github.event.inputs.article_path || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          output_file="$RUNNER_TEMP/blog-articles.txt"
          : > "$output_file"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ ! -f "$INPUT_ARTICLE_PATH" ]; then
              echo "Article path does not exist: $INPUT_ARTICLE_PATH" >&2
              exit 1
            fi
            printf '%s\n' "$INPUT_ARTICLE_PATH" > "$output_file"
          else
            if [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
                "content/blog/posts/**/*.md" "articles/**/*.md" > "$output_file"
            else
              git ls-files "content/blog/posts/**/*.md" "articles/**/*.md" > "$output_file"
            fi
          fi

          if [ ! -s "$output_file" ]; then
            echo "No Markdown blog articles found to publish."
            echo "has_articles=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r article_path; do
            [ -n "$article_path" ] || continue
            if [ ! -f "$article_path" ]; then
              echo "Resolved article path does not exist: $article_path" >&2
              exit 1
            fi
            case "$article_path" in
              *.md) ;;
              *)
                echo "Resolved article path is not Markdown: $article_path" >&2
                exit 1
                ;;
            esac
          done < "$output_file"

          echo "article_list=$output_file" >> "$GITHUB_OUTPUT"
          echo "has_articles=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch articles to wk1995.github.io
        if: steps.articles.outputs.has_articles == 'true'
        env:
          TARGET_REPO_TOKEN: ${{ secrets.PUBLISH_BLOG_FROM_SOURCE_REPO_TO_GITHUB_IO }}
          ARTICLE_LIST: ${{ steps.articles.outputs.article_list }}
          TARGET: ${{ github.event.inputs.target || 'posts' }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'page' }}
          OVERWRITE: ${{ github.event.inputs.overwrite || 'false' }}
        run: |
          set -euo pipefail

          while IFS= read -r article_path; do
            [ -n "$article_path" ] || continue
            echo "Dispatching blog article: $article_path"

            content_base64="$(base64 -w 0 "$article_path")"
            file_name="$(basename "$article_path")"

            ARTICLE_CONTENT_BASE64="$content_base64" \
            ARTICLE_FILE_NAME="$file_name" \
            python - <<'PY' > "$RUNNER_TEMP/blog-dispatch-payload.json"
          import json
          import os

          payload = {
              "event_type": "blog-post-publish",
              "client_payload": {
                  "content_base64": os.environ["ARTICLE_CONTENT_BASE64"],
                  "target": os.environ["TARGET"],
                  "target_branch": os.environ["TARGET_BRANCH"],
                  "overwrite": os.environ["OVERWRITE"],
                  "file_name": os.environ["ARTICLE_FILE_NAME"],
              },
          }
          print(json.dumps(payload))
          PY

            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${TARGET_REPO_TOKEN}" \
              https://api.github.com/repos/wk1995/wk1995.github.io/dispatches \
              --data @"$RUNNER_TEMP/blog-dispatch-payload.json"
          done < "$ARTICLE_LIST"
