name: Publish Desktop Artifact

on:
  workflow_run:
    workflows:
      - Build Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Trusted Build Release run ID. Leave empty to use the latest eligible run.
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-adbpilot-desktop
  cancel-in-progress: false

jobs:
  publish-desktop-artifact:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release

    steps:
      - name: Resolve trusted desktop artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id || '' }}
          ARTIFACT_PREFIX: adbpilot-
          TRUSTED_BRANCH: master
        run: |
          set -euo pipefail

          artifact_root="$GITHUB_WORKSPACE/desktop-artifacts"
          mkdir -p "$artifact_root"

          run_ids=()
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_ids=("$WORKFLOW_RUN_ID")
          elif [ -n "$INPUT_RUN_ID" ]; then
            if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "run_id must be a positive integer." >&2
              exit 1
            fi
            run_ids=("$INPUT_RUN_ID")
          else
            mapfile -t run_ids < <(gh api \
              "repos/$SOURCE_REPOSITORY/actions/workflows/build-release.yml/runs?status=success&branch=$TRUSTED_BRANCH&per_page=30" \
              --jq '.workflow_runs[].id')
          fi

          if [ "${#run_ids[@]}" -eq 0 ] || [ -z "${run_ids[0]}" ]; then
            echo "No successful Build Release runs were found." >&2
            exit 1
          fi

          selected_run_id=""
          selected_artifact=""
          selected_source_sha=""
          selected_source_event=""
          for run_id in "${run_ids[@]}"; do
            [ -n "$run_id" ] || continue

            run_name="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id" --jq '.name')"
            run_event="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id" --jq '.event')"
            run_branch="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id" --jq '.head_branch // empty')"
            run_sha="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
            conclusion="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"

            if [ "$run_name" != "Build Release" ] || \
              [[ "$run_event" != "push" && "$run_event" != "workflow_dispatch" ]] || \
              [ "$run_branch" != "$TRUSTED_BRANCH" ] || \
              [ "$conclusion" != "success" ] || \
              [[ ! "$run_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Run $run_id is not a trusted successful Build Release run; skipping."
              continue
            fi

            mapfile -t artifact_names < <(gh api \
              "repos/$SOURCE_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq ".artifacts[] | select(.expired == false and (.name | startswith(\"$ARTIFACT_PREFIX\"))) | .name")
            if [ "${#artifact_names[@]}" -ne 1 ]; then
              echo "Run $run_id must contain exactly one non-expired $ARTIFACT_PREFIX* desktop artifact."
              continue
            fi

            selected_run_id="$run_id"
            selected_artifact="${artifact_names[0]}"
            selected_source_sha="$run_sha"
            selected_source_event="$run_event"
            break
          done

          if [ -z "$selected_run_id" ]; then
            echo "No trusted desktop artifact was found." >&2
            exit 1
          fi

          gh run download "$selected_run_id" \
            --repo "$SOURCE_REPOSITORY" \
            --name "$selected_artifact" \
            --dir "$artifact_root"

          archive_count="$(find "$artifact_root" -type f \( \
            -iname '*.exe' -o -iname '*.msi' -o -iname '*.msix' -o -iname '*.appx' -o \
            -iname '*.dmg' -o -iname '*.pkg' -o -iname '*.deb' -o -iname '*.rpm' -o \
            -iname '*.appimage' -o -iname '*.zip' \) | wc -l | tr -d ' ')"
          manifest_count="$(find "$artifact_root" -type f -name 'release-manifest.json' | wc -l | tr -d ' ')"
          if [ "$archive_count" = "0" ] || [ "$manifest_count" != "1" ]; then
            echo "Artifact must contain at least one desktop archive and exactly one release-manifest.json." >&2
            exit 1
          fi

          echo "source_run_id=$selected_run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$selected_source_sha" >> "$GITHUB_OUTPUT"
          echo "source_event=$selected_source_event" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$(find "$artifact_root" -type f -name 'release-manifest.json' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.artifact.outputs.source_sha }}
          path: source-verification
          fetch-depth: 0

      - name: Verify source and desktop artifact provenance
        id: provenance
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ steps.artifact.outputs.source_run_id }}
          EXPECTED_SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
          EXPECTED_SOURCE_REF: refs/heads/master
          EXPECTED_SOURCE_EVENT: ${{ steps.artifact.outputs.source_event }}
          RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}/desktop-artifacts
          RELEASE_MANIFEST_FILE: ${{ steps.artifact.outputs.manifest_path }}
          RELEASE_KIND: desktop
          TRUSTED_BRANCH: master
        run: |
          set -euo pipefail

          git -C source-verification fetch --no-tags origin "+refs/heads/$TRUSTED_BRANCH:refs/remotes/origin/$TRUSTED_BRANCH"
          if ! git -C source-verification merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" "refs/remotes/origin/$TRUSTED_BRANCH"; then
            echo "Release source commit is not contained in $TRUSTED_BRANCH." >&2
            exit 1
          fi
          python3 source-verification/.github/scripts/verify_release_artifact.py

      - name: Check target repository token
        env:
          TARGET_REPO_TOKEN: ${{ secrets.PUBLISH_APP_FROM_ADB_PILOT_TO_GITHUB_IO }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "Missing secret PUBLISH_APP_FROM_ADB_PILOT_TO_GITHUB_IO. It must be a fine-grained token with Contents: Read and write on wk1995/wk1995.github.io." >&2
            exit 1
          fi

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wk1995/wk1995.github.io
          ref: main
          token: ${{ secrets.PUBLISH_APP_FROM_ADB_PILOT_TO_GITHUB_IO }}
          path: target-site
          fetch-depth: 0

      - name: Stage immutable desktop packages
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ github.workspace }}/desktop-artifacts
          TARGET_REPOSITORY_ROOT: ${{ github.workspace }}/target-site
          PUBLISHED_PATHS_FILE: ${{ github.workspace }}/published-desktop-paths.txt
        run: python3 source-verification/.github/scripts/stage_immutable_desktop_packages.py

      - name: Commit and push package files
        working-directory: target-site
        env:
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source_run_id }}
        run: |
          set -euo pipefail

          git config user.name "github-publish-actions[bot]"
          git config user.email "41898282+github-publish-actions[bot]@users.noreply.github.com"
          while IFS= read -r target_path; do
            [ -n "$target_path" ] || continue
            git add -- "$target_path"
          done < "$GITHUB_WORKSPACE/published-desktop-paths.txt"
          if git diff --cached --quiet; then
            echo "No package file changes to commit."
            exit 0
          fi

          git commit -m "[codex] publish immutable desktop artifacts from run $SOURCE_RUN_ID"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Target main advanced during push (attempt $attempt); retrying."
          done
          echo "Could not push package commit after 3 attempts." >&2
          exit 1
