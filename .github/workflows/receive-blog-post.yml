name: Receive Blog Post

on:
  repository_dispatch:
    types:
      - blog-post-publish
  workflow_dispatch:
    inputs:
      content_base64:
        description: "Base64 encoded Markdown article with frontmatter"
        required: true
      target:
        description: "posts publishes to the blog; drafts stores a review draft"
        required: true
        default: "posts"
      file_name:
        description: "Optional output Markdown file name"
        required: false
      overwrite:
        description: "Allow replacing an existing Markdown file"
        required: true
        default: "false"
      target_branch:
        description: "Branch that stores site content"
        required: true
        default: "page"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: receive-blog-post-${{ github.event.client_payload.target_branch || inputs.target_branch || 'page' }}
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TARGET_BRANCH: ${{ github.event.client_payload.target_branch || inputs.target_branch || 'page' }}
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write incoming article
        id: receive_post
        env:
          BLOG_POST_CONTENT_BASE64: ${{ github.event.client_payload.content_base64 || inputs.content_base64 }}
          BLOG_POST_TARGET: ${{ github.event.client_payload.target || inputs.target || 'posts' }}
          BLOG_POST_FILE_NAME: ${{ github.event.client_payload.file_name || inputs.file_name }}
          BLOG_POST_OVERWRITE: ${{ github.event.client_payload.overwrite || inputs.overwrite || 'false' }}
        run: node scripts/blog/receive-blog-post.mjs

      - name: Build blog
        run: node scripts/blog/build-blog.mjs

      - name: Commit article and generated blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog blog/posts
          if git diff --cached --quiet; then
            echo "No blog changes to commit."
          else
            git commit -m "Add external blog post"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
