<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人 App · WK1995</title>
  <meta name="description" content="WK1995 的个人 App 列表和安装包下载二维码。">
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="../assets/catalog-pages.css">
</head>
<body data-page="personalAppsPage">
  <nav class="catalog-topbar">
    <a class="catalog-brand" href="/" aria-label="返回首页">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 2.75A1.75 1.75 0 0 1 3.75 1h8.5A1.75 1.75 0 0 1 14 2.75v10.5A1.75 1.75 0 0 1 12.25 15h-8.5A1.75 1.75 0 0 1 2 13.25V2.75Zm1.5 0v10.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25ZM6 11.75A.75.75 0 0 1 6.75 11h2.5a.75.75 0 0 1 0 1.5h-2.5A.75.75 0 0 1 6 11.75Z"></path>
      </svg>
      <span>WK Apps</span>
    </a>
    <div class="catalog-topbar-actions">
      <label class="control-group">
        <span class="control-label" id="language-label" data-i18n="controls.language">语言</span>
        <select class="language-select" id="language-select" aria-label="语言">
          <option value="zh">简体中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <div class="control-group">
        <span class="control-label" id="theme-caption" data-i18n="controls.theme">主题</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path id="theme-icon" d="M9.598 1.591a.75.75 0 0 1 .287.857 6.998 6.998 0 0 0 8.442 8.442.75.75 0 0 1 .857.287.75.75 0 0 1-.131.94A8.5 8.5 0 1 1 8.658.722a.75.75 0 0 1 .94-.131Z"></path>
          </svg>
          <span id="theme-label" data-i18n="controls.theme.dark">暗色</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="catalog-shell">
    <header class="catalog-page-head apps-hero">
      <div class="apps-hero-copy">
        <p class="catalog-kicker" data-app-text="eyebrow">App Distribution</p>
        <h1 data-app-text="title">应用分发中心</h1>
        <p data-app-text="intro">集中查看由 CI 持续发布的安装包，按平台或版本快速定位，并通过链接或二维码获取最新构建。</p>
      </div>
      <a class="catalog-primary-link apps-directory-link" href="packages/">
        <span data-app-text="packageDir">浏览文件目录</span>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5.22 3.72a.75.75 0 0 1 1.06 0l3.75 3.75a.75.75 0 0 1 0 1.06l-3.75 3.75a.75.75 0 1 1-1.06-1.06L8.44 8 5.22 4.78a.75.75 0 0 1 0-1.06Z"></path>
        </svg>
      </a>
      <div class="apps-overview" aria-label="发布概览">
        <div class="apps-overview-item">
          <span data-app-text="publishedApps">已发布应用</span>
          <strong id="app-total-stat">0</strong>
        </div>
        <div class="apps-overview-item">
          <span data-app-text="activePlatforms">覆盖平台</span>
          <strong id="app-platform-stat">0</strong>
        </div>
        <div class="apps-overview-item">
          <span data-app-text="availableBuilds">可用版本</span>
          <strong id="app-release-stat">0</strong>
        </div>
        <div class="apps-overview-signal">
          <span class="apps-signal-dot" aria-hidden="true"></span>
          <span data-app-text="syncStatus">清单自动同步</span>
        </div>
      </div>
    </header>

    <div class="apps-workbench">
      <aside class="apps-sidebar" aria-label="App 筛选">
        <section class="catalog-toolbar">
          <label class="catalog-search">
            <span data-app-text="searchLabel">搜索应用</span>
            <span class="apps-search-field">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6.75 2a4.75 4.75 0 1 0 2.993 8.44l2.909 2.908a.75.75 0 1 0 1.06-1.06l-2.908-2.909A4.75 4.75 0 0 0 6.75 2Zm-3.25 4.75a3.25 3.25 0 1 1 6.5 0 3.25 3.25 0 0 1-6.5 0Z"></path>
              </svg>
              <input id="app-search" type="search" autocomplete="off" placeholder="名称 / 包名 / 版本">
            </span>
          </label>
          <div class="catalog-current" id="app-source"></div>
        </section>

        <div class="apps-filter-heading">
          <span data-app-text="platformFilter">平台筛选</span>
        </div>
        <nav class="catalog-platforms" id="app-platforms" aria-label="平台分类"></nav>
      </aside>

      <section class="catalog-section apps-results">
        <div class="catalog-section-head">
          <div>
            <p class="catalog-kicker" data-app-text="listEyebrow">Release Library</p>
            <h2 data-app-text="listTitle">应用与安装包</h2>
          </div>
          <span class="apps-result-count"><strong id="app-count">0</strong> <span data-app-text="resultUnit">项</span></span>
        </div>
        <div class="app-platform-groups" id="app-groups"></div>
      </section>
    </div>

    <div class="catalog-status" id="app-status" role="status" aria-live="polite"></div>
  </main>

  <script src="../assets/site.js"></script>
  <script src="../assets/personal-apps.js"></script>
</body>
</html>
